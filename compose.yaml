name: agentsdk

x-agentbench: &agentbench
  build:
    context: .
    dockerfile: containers/agentbench/Dockerfile
  image: agentsdk-agentbench:local
  working_dir: /workspace
  env_file:
    - .env
  environment:
    AWS_CA_BUNDLE: /home/agentbench/.aws/q2-ca-bundle.pem
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
    AWS_PROFILE: ${AWS_PROFILE:-Q2Developer-#########}
    AWS_REGION: ${AWS_REGION:-us-east-2}
    CODEX_HOME: /home/agentbench/.bedrock_codex
    CODEX_SOURCE_HOME: /mnt/codex-host
    HOME: /home/agentbench
    SSL_CERT_FILE: /home/agentbench/.aws/q2-ca-bundle.pem
  tmpfs:
    - /home/agentbench/.bedrock_codex:uid=1000,gid=1000,mode=0700
  volumes:
    - ./var:/workspace/var
    - ./.env:/workspace/.env:ro
    - ./configurations.yaml:/workspace/configurations.yaml:ro
    - ${HOME}/.aws:/home/agentbench/.aws:ro
    - ${CODEX_HOME}:/mnt/codex-host:ro
    - type: bind
      source: ${HOME}/projects/pl-data-plugins/product_support_updates.json
      target: /workspace/product_support_updates.json
      read_only: true
      bind:
        create_host_path: false
    - ./var/mlflow/assistant:/home/agentbench/.mlflow/assistant

services:
  mlflow:
    <<: *agentbench
    environment:
      AWS_CA_BUNDLE: /home/agentbench/.aws/q2-ca-bundle.pem
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
      AWS_PROFILE: ${AWS_PROFILE:-Q2Developer-#########}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      CODEX_HOME: /home/agentbench/.bedrock_codex
      CODEX_SOURCE_HOME: /mnt/codex-host
      HOME: /home/agentbench
      MLFLOW_ENABLE_REMOTE_ASSISTANT: "true"
      SSL_CERT_FILE: /home/agentbench/.aws/q2-ca-bundle.pem
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*
      - --backend-store-uri
      - sqlite:////workspace/var/mlflow/backend.db
      - --default-artifact-root
      - /workspace/var/mlflow/artifacts
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
      interval: 5s
      timeout: 3s
      retries: 12

  init:
    <<: *agentbench
    command:
      - agentbench
      - init
      - --tracking-uri
      - http://mlflow:5000
      - --artifact-root
      - /workspace/var/mlflow/artifacts
    depends_on:
      mlflow:
        condition: service_healthy

  assistant-init:
    <<: *agentbench
    command:
      - agentbench
      - configure-assistant
      - --provider
      - ${MLFLOW_ASSISTANT_PROVIDER:-bedrock}
      - --tracking-uri
      - http://mlflow:5000
      - --model
      - ${CODEX_ASSISTANT_MODEL:-default}
      - --region
      - ${AWS_REGION:-us-east-2}
      - --config-path
      - /home/agentbench/.mlflow/assistant/config.json
    depends_on:
      mlflow:
        condition: service_healthy

  prod-support-mcp:
    <<: *agentbench
    environment:
      AWS_CA_BUNDLE: /home/agentbench/.aws/q2-ca-bundle.pem
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
      AWS_PROFILE: ${AWS_PROFILE:-Q2Developer-#########}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      CODEX_HOME: /home/agentbench/.bedrock_codex
      CODEX_SOURCE_HOME: /mnt/codex-host
      HOME: /home/agentbench
      PROD_SUPPORT_MCP_HOST: 0.0.0.0
      PROD_SUPPORT_MCP_PORT: "8000"
      PROD_SUPPORT_MCP_TRANSPORT: streamable-http
      PROD_SUPPORT_SOURCE: production
      PROD_SUPPORT_UPDATES_PATH: /workspace/product_support_updates.json
      Q2_MCP_DEBUG: "1"
      Q2_OTEL_EXPORTER: none
      RESOURCE_DISCOVERY_CLIENT_LOOKUP: /workspace/src/workspaces/data_engineering/skills/resource-discovery/references/client-guuid-lookup.json
      SSL_CERT_FILE: /home/agentbench/.aws/q2-ca-bundle.pem
    command:
      - prod-support-mcp
    ports:
      - "127.0.0.1:8765:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"
      interval: 5s
      timeout: 3s
      retries: 12

  evaluation:
    <<: *agentbench
    command:
      - agentbench
      - replay-evaluate
      - prod-support
      - --case
      - ${CASE_ID:-prod-support-us-ca-2026-09-25}
      - --dataset
      - ${DATASET_PATH:-/workspace/var/benchmark_data/prod_support/2026-09-24/steps/02-airflow-capture/2026-09-24/airflow_failures.json}
      - --tracking-uri
      - http://mlflow:5000
    depends_on:
      init:
        condition: service_completed_successfully
