name: agentsdk

x-agentbench: &agentbench
  build:
    context: .
    dockerfile: containers/agentbench/Dockerfile
  image: agentsdk-agentbench:local
  working_dir: /workspace
  volumes:
    - ./var:/workspace/var
    - ./.env:/workspace/.env:ro
    - ./configurations.yaml:/workspace/configurations.yaml:ro

services:

  prod-support-mcp:
    <<: *agentbench
    env_file:
      - .env
    volumes:
      - ./var:/workspace/var
      - ./.env:/workspace/.env:ro
      - ./configurations.yaml:/workspace/configurations.yaml:ro
      - type: bind
        source: ${HOME}/projects/pl-data-plugins/product_support_updates.json
        target: /workspace/product_support_updates.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      Q2_MCP_DEBUG: "1"
      PROD_SUPPORT_MCP_HOST: 0.0.0.0
      PROD_SUPPORT_MCP_PORT: "8000"
      PROD_SUPPORT_MCP_TRANSPORT: streamable-http
      PROD_SUPPORT_SOURCE: production
      PROD_SUPPORT_UPDATES_PATH: /workspace/product_support_updates.json
      LINEAGE_GRAPH_PATH: /workspace/var/lineage/di-pipelines.json
    command:
      - --server
      - prod-support
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8765:8000"
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - 127.0.0.1
        - "8000"
      interval: 5s
      timeout: 3s
      retries: 12

  warehouse-mcp:
    <<: *agentbench
    volumes:
      - ./var:/workspace/var
      - ./.env:/workspace/.env:ro
      - ./configurations.yaml:/workspace/configurations.yaml:ro
      - type: bind
        source: ${DS_AIRFLOW_SNOWFLAKE_CONNECTION_FILE:-${HOME}/projects/ds-airflow/chart/local_connections/de_transforms_snowflake.json}
        target: /run/secrets/ds-airflow-snowflake.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      Q2_MCP_DEBUG: "1"
      WAREHOUSE_ENVIRONMENT: ${WAREHOUSE_ENVIRONMENT:-sandbox}
      WAREHOUSE_SANDBOX_CORTEX_RECORDINGS: ${WAREHOUSE_SANDBOX_CORTEX_RECORDINGS:-/workspace/var/cortex-recordings}
      SNOWFLAKE_DEV_CONNECTION_FILE: /run/secrets/ds-airflow-snowflake.json
      SNOWFLAKE_DEV_ACCOUNT: ${SNOWFLAKE_DEV_ACCOUNT:-}
      SNOWFLAKE_DEV_USER: ${SNOWFLAKE_DEV_USER:-}
      SNOWFLAKE_DEV_ROLE: ${SNOWFLAKE_DEV_ROLE:-}
      SNOWFLAKE_DEV_WAREHOUSE: ${SNOWFLAKE_DEV_WAREHOUSE:-}
      SNOWFLAKE_DEV_DATABASE: ${SNOWFLAKE_DEV_DATABASE:-}
      SNOWFLAKE_DEV_SCHEMA: ${SNOWFLAKE_DEV_SCHEMA:-}
      SNOWFLAKE_DEV_AUTHENTICATOR: ${SNOWFLAKE_DEV_AUTHENTICATOR:-snowflake_jwt}
      SNOWFLAKE_DEV_SECRET_REF: ${SNOWFLAKE_DEV_SECRET_REF:-}
      SNOWFLAKE_DEV_PASSWORD: ${SNOWFLAKE_DEV_PASSWORD:-}
      SNOWFLAKE_DEV_TOKEN: ${SNOWFLAKE_DEV_TOKEN:-}
      SNOWFLAKE_STAGE_ACCOUNT: ${SNOWFLAKE_STAGE_ACCOUNT:-}
      SNOWFLAKE_STAGE_USER: ${SNOWFLAKE_STAGE_USER:-}
      SNOWFLAKE_STAGE_ROLE: ${SNOWFLAKE_STAGE_ROLE:-}
      SNOWFLAKE_STAGE_WAREHOUSE: ${SNOWFLAKE_STAGE_WAREHOUSE:-}
      SNOWFLAKE_STAGE_DATABASE: ${SNOWFLAKE_STAGE_DATABASE:-}
      SNOWFLAKE_STAGE_SCHEMA: ${SNOWFLAKE_STAGE_SCHEMA:-}
      SNOWFLAKE_STAGE_AUTHENTICATOR: ${SNOWFLAKE_STAGE_AUTHENTICATOR:-snowflake}
      SNOWFLAKE_STAGE_SECRET_REF: ${SNOWFLAKE_STAGE_SECRET_REF:-}
      SNOWFLAKE_STAGE_PASSWORD: ${SNOWFLAKE_STAGE_PASSWORD:-}
      SNOWFLAKE_STAGE_TOKEN: ${SNOWFLAKE_STAGE_TOKEN:-}
      SNOWFLAKE_PROD_ACCOUNT: ${SNOWFLAKE_PROD_ACCOUNT:-}
      SNOWFLAKE_PROD_USER: ${SNOWFLAKE_PROD_USER:-}
      SNOWFLAKE_PROD_ROLE: ${SNOWFLAKE_PROD_ROLE:-}
      SNOWFLAKE_PROD_WAREHOUSE: ${SNOWFLAKE_PROD_WAREHOUSE:-}
      SNOWFLAKE_PROD_DATABASE: ${SNOWFLAKE_PROD_DATABASE:-}
      SNOWFLAKE_PROD_SCHEMA: ${SNOWFLAKE_PROD_SCHEMA:-}
      SNOWFLAKE_PROD_AUTHENTICATOR: ${SNOWFLAKE_PROD_AUTHENTICATOR:-snowflake}
      SNOWFLAKE_PROD_SECRET_REF: ${SNOWFLAKE_PROD_SECRET_REF:-}
      SNOWFLAKE_PROD_PASSWORD: ${SNOWFLAKE_PROD_PASSWORD:-}
      SNOWFLAKE_PROD_TOKEN: ${SNOWFLAKE_PROD_TOKEN:-}
    command:
      - --server
      - warehouse
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "127.0.0.1:8766:8001"
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - 127.0.0.1
        - "8001"
      interval: 5s
      timeout: 3s
      retries: 12
