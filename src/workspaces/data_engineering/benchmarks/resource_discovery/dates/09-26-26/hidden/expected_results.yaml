schema_version: 1
benchmark_id: data_engineering.resource_operations.resource_discovery
cases:
  - id: resource-discovery-case-001
    outcome: unique_match
    match_count: 1
    record_ids:
      - syn-record-001
    selected_resource:
      client_guid: 00000000-0000-4000-8000-000000000101
      client_name: Lattice Harbor Cooperative
      provisioned_client_id: lhc-101
      subdomain: lattice-harbor
      environment: production
      zone: us-east
      service: application
      resource_set: core
      database_server: syn-db-east-01
      database_name: lattice_harbor_core
      storage_account: synstlatticeharbor01
      storage_container: client-data
      datalake_account: syn-dl-east-01
      datalake_filesystem: lattice-harbor
    required_evidence:
      - syn-record-001
      - exact client_guid query
    prohibited:
      - inventing values absent from the record
      - disclosing credentials or secret values

  - id: resource-discovery-case-002
    outcome: no_match
    match_count: 0
    record_ids: []
    required_evidence:
      - client_name query
      - synthetic catalog contains no matching record
    prohibited:
      - inferring a client from a partial name
      - presenting another client as the requested client

  - id: resource-discovery-case-003
    outcome: ambiguous_match
    match_count: 2
    record_ids:
      - syn-record-003
      - syn-record-004
    disambiguators:
      - client_guid
      - environment
      - subdomain
    required_evidence:
      - client_name query
      - both matching record_ids
    prohibited:
      - silently selecting one candidate
      - collapsing production and staging into one resource
