schema_version: 1
benchmark_id: data_engineering.resource_operations.resource_discovery
cases:
  - id: case-001
    outcome: unique_match
    match_count: 1
    record_ids:
      - syn-record-001
    selected_resource:
      client_guid: 00000000-0000-4000-8000-000000000101
      client_name: Renasant Bank (Tupelo, MS)
      provisioned_client_id: benchmark-client-101
      subdomain: benchmark-101
      environment: production
      zone: us-east
      service: application
      resource_set: core
      database_server: syn-db-east-01
      database_name: benchmark_client_101
      storage_account: synstbenchmark101
      storage_container: client-data
      datalake_account: syn-dl-east-01
      datalake_filesystem: benchmark-101
    required_evidence:
      - syn-record-001
      - exact client_guid query
    prohibited:
      - inventing values absent from the record
      - disclosing credentials or secret values

  - id: case-002
    outcome: no_match
    match_count: 0
    record_ids: []
    required_evidence:
      - client_name query
      - synthetic catalog contains no matching record
    prohibited:
      - inferring a client from a partial name
      - presenting another client as the requested client

  - id: case-003
    outcome: ambiguous_match
    match_count: 2
    record_ids:
      - syn-record-003
      - syn-record-004
    disambiguators:
      - client_guid
      - environment
      - subdomain
    required_evidence:
      - client_name query
      - both matching record_ids
    prohibited:
      - silently selecting one candidate
      - collapsing production and staging into one resource

  - id: case-004
    canonical_client:
      client_name: Bank of America
      client_guid: 00000000-0000-4000-8000-000000000401
    initial_memory_count: 0
    confirmation_threshold: 3
    expected_events:
      - conversation: conversation-1
        turn: 1
        status: confirmation_required
        required_terms:
          - Bank of America
          - 00000000-0000-4000-8000-000000000401
      - conversation: conversation-1
        turn: 3
        status: proposed
        evidence_count: 1
        prohibited_status: confirmed
      - conversation: conversation-2
        turn: 1
        status: confirmation_required
        evidence_count: 1
        required_terms:
          - Bank of America
          - 00000000-0000-4000-8000-000000000401
    expected_memory:
      kind: alias
      aliases:
        - BOFA
      canonical_entity_id: 00000000-0000-4000-8000-000000000401
      evidence_count: 1
      status: proposed
    prohibited:
      - resolving the alias as confirmed after one confirmation
      - returning a different client GUID
      - storing raw conversation text
      - inferring unrelated client metadata
