schema_version: 1
capability: log_classification
description: Classify terminal evidence without inferring unsupported causes.
cases:
  - id: terminal-evidence-policy
    requirements:
      - classify timeout, OOM, and distinctness only from explicit task evidence
      - preserve dependency-only and unavailable-log states as evidence gaps
      - do not promote an uncorroborated process exit to a confirmed cause
      - retain the evidence source and task-attempt identity
