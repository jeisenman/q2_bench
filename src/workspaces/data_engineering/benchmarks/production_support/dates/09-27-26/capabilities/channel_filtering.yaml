schema_version: 1
capability: channel_filtering
description: Discover all failures while exposing only MI3 and D2P shorthand.
cases:
  - id: omitted-jobs
    default_omission_groups: [d2p, mi3, subscriber, maintenance, backfill, cmm]
    mcp_override_parameter: data_internal_omissions
    required_behavior:
      - retain omitted jobs in captured evidence
      - read the exact failed-task log for registered D2P and MI3 candidates
      - collapse a candidate only after a same-DAG and same-task success inside the window
      - allow other configured omissions in the complete developer diagnosis
      - include represented MI3 and D2P once in that canonical order
      - use Ongoing with the shorthand as an indented detail when no actionable details exist
      - never render detailed MI3 or D2P failures
      - hide subscriber, maintenance, backfill, and cmm from Data Internal
      - exclude omitted jobs from rerun follow-ups
      - treat credit_migration_matrix and CMM as the cmm omission group
      - replace defaults when the MCP caller supplies an override
      - include all jobs when the MCP caller supplies an empty list
      - keep unverified candidates as ordinary diagnosed failures
    punish_if_missing_from_discovery: true
    punish_if_mi3_or_d2p_shorthand_missing: true
