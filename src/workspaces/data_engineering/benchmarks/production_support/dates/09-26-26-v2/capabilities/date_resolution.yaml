schema_version: 1
capability: date_resolution
description: Resolve the operational day and bounded Airflow query intervals.
cases:
  - id: today-bounded-window
    prompt: Do today's prod support
    reference_time: "2026-09-26T16:00:00Z"
    required_ui_filter_semantics:
      _flt_1_end_date: less_than
      _flt_2_end_date: greater_than_or_equal
      _flt_3_state: equals_failed
    require_raw_iso_utc_timestamps: true
    prohibit_one_sided_ui_window: true
