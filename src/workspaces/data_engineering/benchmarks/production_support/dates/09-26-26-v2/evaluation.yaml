schema_version: 1
matrix_id: prod-support-09-26-26-v2
suite: 09-26-26-v2
benchmark: production-support
experiment_name: production_operations
execution:
  runtime: container
  container_image: agentsdk-agentbench:local
  parallelism: 5
  sandbox: read-only
  artifact_root: var/benchmark_matrix/prod-support-09-26-26-v2
judge_configuration: sol-high-judge
rubric:
  - id: prior_run_log_fallback
    weight: 2.5
    reward: Pages backward across the same DAG and task when the latest log is unavailable, then cites the first prior terminal evidence.
    punish: Stops at an empty or unavailable latest log, changes task identity, or searches unrelated runs.
  - id: bounded_airflow_links
    weight: 2.0
    reward: Links use both lower and upper end-date filters for the requested day.
    punish: A one-sided filter includes failures from prior or subsequent days.
  - id: client_identity_resolution
    weight: 2.5
    reward: Resolves every client UUID found in a DAG or task identifier before triage and uses Resource Discovery names plus three-character UUID prefixes in both messages.
    punish: Emits bare prefixes, raw UUIDs without names, skips task-embedded or non-resend clients, or guesses an ambiguous identity.
  - id: complete_log_retrieval
    weight: 2.5
    reward: Fetches the exact task-attempt log for every failure and continues past non-terminal discovery excerpts to terminal evidence, explicit truncation, or unavailable status.
    punish: Skips exact-log retrieval because any log text exists or classifies a log that ends while the job is still running.
  - id: spark_evidence_race
    weight: 2.5
    reward: Starts exact Airflow-log and OMS queries concurrently for Spark jobs.
    punish: Uses only one source or serializes independent evidence queries.
  - id: timeout_short_circuit
    weight: 2.0
    reward: Classifies explicit AirflowTaskTimeout evidence and cancels pending OMS work.
    punish: Reports an unknown driver exit or waits for unnecessary OMS work.
  - id: cluster_health
    weight: 2.0
    reward: Checks KEDA and pods in both regions, puts US and CA Cluster Health first in Developer, and formats Data Internal cluster issues as status plus observed symptoms.
    punish: Cluster Health follows failure details, omits a region or evidence source, or reports a cluster issue without concrete symptoms.
  - id: regional_consistency
    weight: 3.0
    reward: Every US finding appears only under US and every CA finding appears only under CA.
    punish: A CA finding appears under US, a US finding appears under CA, or a cross-region group obscures source region.
  - id: contradiction_detection
    weight: 3.0
    reward: Derives each regional status from primary evidence and keeps access gaps or retired replicas as separate warnings.
    punish: Gives conflicting health verdicts or promotes a warning beyond what the primary evidence supports.
  - id: grouped_reporting
    weight: 3.0
    reward: Groups clients sharing a job and groups each client's remaining jobs once; proven timeout, OOM, and distinctness errors remain explicit.
    punish: Repeats a client-job pair, leaves one client's jobs split across bullets, or omits a proven high-value diagnosis.
  - id: resource_discovery_routing
    weight: 2.0
    reward: Uses Resource Discovery to select and link each client's reviewed resend-events application.
    punish: Omits a reviewed link, guesses from Airflow region or subdomain, or links the wrong client environment.
  - id: resend_specificity
    weight: 2.0
    reward: Gives each client, resend date, event count, and correct application line by line.
    punish: Groups ambiguous resend instructions or omits a requested date.
  - id: large_resend_escalation
    weight: 1.5
    reward: Preserves the threshold evidence in Developer and adds the configured owner escalation in Follow Ups.
    punish: Hides an above-threshold resend or repeats follow-up-only count details in Data Internal.
  - id: omitted_job_filter
    weight: 1.5
    reward: Discovers all failures while default-omitting D2P, MI3, subscriber, maintenance, backfill, and CMM groups from Data Internal and rerun follow-ups; honors MCP overrides.
    punish: Drops omitted jobs from investigation, includes a default omission in Data Internal or rerun suggestions, or ignores an explicit MCP override.
  - id: developer_readability
    weight: 2.0
    reward: Groups clients sharing a failed job and groups multiple jobs for one client while preserving per-failure evidence.
    punish: Emits repeated client-job pairs, bare identifiers, classifications without explanation, or incomplete errors.
  - id: root_cause_coverage
    weight: 2.5
    reward: Gives an evidence-backed root cause or explicitly states what evidence is missing.
    punish: Lists a failure without diagnosis or presents speculation as fact.
  - id: follow_up_actionability
    weight: 2.0
    reward: Follow Ups contains only approval-gated resends and non-omitted reruns, escalates resends over 100 to pd-rix, and links jobs over five attempts to the KPO sizing agent interface.
    punish: Includes diagnostic work, schema upgrades, omitted jobs, unlinked resends, or fails to include the pd-rix or KPO handoff when required.
  - id: evidence_efficiency
    weight: 2.0
    reward: Runs the reusable compact evidence command once, records exact retrieval source and status for every failure, and retains at most three evidence lines.
    punish: Prints raw logs or execution JSONL, retries failed utilities, or manually repeats work handled by the parser.
  - id: generalization
    weight: 1.5
    reward: Derives dates, paths, identities, and filters from the case manifest and evidence.
    punish: Hard-codes the benchmark date, case ID, client list, or worker paths.
  - id: token_efficiency
    weight: 2.0
    reward: Returns only the required report and bounded evidence records.
    punish: Emits oversized tool output, repeated findings, repository exploration, or raw evidence bodies.
group_by: [matrix_id, suite, case_id]
compare_by: [profile, model, reasoning_effort]
