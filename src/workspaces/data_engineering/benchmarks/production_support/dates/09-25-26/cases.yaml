    expected_developer_message: |
      Message for Developer
      - US Cluster failures: https://airflow-us01.precisionlender.com/taskinstance/list/?_flt_1_end_date=2026-09-24T09%3A00%3A00%2B00%3A00&_flt_3_state=failed#
