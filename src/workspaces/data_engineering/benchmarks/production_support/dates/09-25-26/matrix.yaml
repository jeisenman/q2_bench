rubric:
  - id: automation
    weight: 1.5
    reward: Uses reusable Python scripts or CLIs, especially the Airflow CLI.
    punish: Repeats manual work that reliable automation could perform.
  - id: generalization
    weight: 1.5
    reward: Derives dates, identifiers, and filters from inputs.
    punish: Hard-codes behavior or conclusions for a specific benchmark day.
  - id: tool_relevance
    weight: 1.5
    reward: Every tool call contributes directly to discovery, diagnosis, or reporting.
    punish: Makes unrelated, duplicative, or speculative tool calls.
  - id: batch_evidence_selection
    weight: 2.0
    reward: Uses Airflow task logs as the primary evidence for batch jobs.
    punish: Queries OMS for batch jobs when Airflow logs are sufficient.
  - id: oms_efficiency
    weight: 2.0
    reward: Uses one direct OMS query with exact job identity when OMS is warranted.
    punish: Uses broad searches, scans unrelated tables, repeats queries, or omits filters.
  - id: parallelization
    weight: 1.5
    reward: Investigates independent failures or regions concurrently.
    punish: Serializes independent work without a dependency-based reason.
  - id: token_efficiency
    weight: 1.0
    reward: Uses concise prompts, evidence, and responses without losing required facts.
    punish: Emits oversized logs, repeats evidence, or spends tokens on irrelevant reasoning.
  - id: evolution_efficiency
    weight: 2.0
    reward: Improves elapsed time and estimated price versus comparable earlier traces.
    punish: Regresses time or price without a measured quality improvement.
group_by:
  - matrix_id
  - suite
  - case_id
compare_by:
  - profile
  - model
  - reasoning_effort
