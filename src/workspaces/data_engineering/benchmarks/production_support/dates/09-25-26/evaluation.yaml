schema_version: 1
matrix_id: prod-support-09-25-26
suite: 09-25-26
benchmark: production-support
experiment_name: production_operations
execution:
  runtime: container
  container_image: agentsdk-agentbench:local
  parallelism: 6
  sandbox: read-only
  artifact_root: var/benchmark_matrix/prod-support-09-25-26
judge_configuration: sol-high-judge
rubric:
  - id: bounded_airflow_links
    weight: 2.0
    reward: Links use both lower and upper end-date filters for September 24.
    punish: A one-sided filter includes failures outside the requested day.
  - id: spark_evidence_race
    weight: 2.5
    reward: Starts exact Airflow-log and OMS queries concurrently for Spark jobs.
    punish: Uses only one source or serializes independent evidence queries.
  - id: timeout_short_circuit
    weight: 2.0
    reward: Cancels pending OMS work when Airflow proves an AirflowTaskTimeout.
    punish: Waits for unnecessary OMS work after definitive timeout evidence.
  - id: cluster_health
    weight: 2.0
    reward: Checks KEDA ScaledObjects and pods in US and CA and reports both health lines.
    punish: Omits either region, KEDA, pods, or evidence-qualified health status.
  - id: resource_discovery_routing
    weight: 2.0
    reward: Uses resource discovery to select the client's correct resend application.
    punish: Guesses a domain or supplies a link for the wrong client environment.
  - id: large_resend_escalation
    weight: 1.5
    reward: Calls out more than 100 unique events in developer and Data Internal messages.
    punish: Hides a large resend count in either audience's message.
  - id: omitted_job_filter
    weight: 1.5
    reward: Discovers all failures but omits configured noisy jobs from Data Internal.
    punish: Drops them from investigation or includes them in the channel message.
  - id: root_cause_coverage
    weight: 2.5
    reward: Gives an evidence-backed root cause or explicitly states what evidence is missing.
    punish: Lists a failure without diagnosis or presents speculation as fact.
  - id: automation
    weight: 1.5
    reward: Uses reusable Python scripts or CLIs, especially the Airflow CLI.
    punish: Repeats manual work that reliable automation could perform.
  - id: generalization
    weight: 1.5
    reward: Derives dates, identifiers, and filters from inputs.
    punish: Hard-codes behavior or conclusions for a specific benchmark day.
  - id: tool_relevance
    weight: 1.5
    reward: Every tool call contributes directly to discovery, diagnosis, or reporting.
    punish: Makes unrelated, duplicative, or speculative tool calls.
  - id: batch_evidence_selection
    weight: 2.0
    reward: Uses Airflow task logs as primary evidence for batch jobs and dual sources for Spark.
    punish: Uses OMS for non-Spark batch jobs without an evidence gap.
  - id: oms_efficiency
    weight: 2.0
    reward: Uses one direct OMS query with exact job identity when OMS is warranted.
    punish: Uses broad searches, scans unrelated tables, repeats queries, or omits filters.
  - id: parallelization
    weight: 1.5
    reward: Investigates independent failures or regions concurrently.
    punish: Serializes independent work without a dependency-based reason.
  - id: token_efficiency
    weight: 1.0
    reward: Uses concise prompts, evidence, and responses without losing required facts.
    punish: Emits oversized logs, repeats evidence, or spends tokens on irrelevant reasoning.
  - id: evolution_efficiency
    weight: 2.0
    reward: Improves elapsed time and estimated price versus comparable earlier traces.
    punish: Regresses time or price without a measured quality improvement.
group_by:
  - matrix_id
  - suite
  - case_id
compare_by:
  - profile
  - model
  - reasoning_effort
