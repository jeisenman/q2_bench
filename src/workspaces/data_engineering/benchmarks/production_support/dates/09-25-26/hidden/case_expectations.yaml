    expected_developer_message: |
      Message for developer:
        - US Cluster Health: healthy; scheduler, DAG processor, and pods were ready at the evidence timestamp.
        - CA Cluster Health: DAG processor unhealthy; pod was running with 13 restarts and 0 active DAGs.
        - Terminology: DV means Distinctness Validation. MI means Market Insights; MI3 means Market Insights 3.
        - BoFA (792): Delivery to Promise Other Products failed with explicit OOM evidence; classification: confirmed_oom.
        - Valley National Bank (8b2): Core Account Financial Statements high quality failed on attempt 4 during DV (Distinctness Validation); classification: distinctness.
        - Bremer Bank, National Association (a6f): Relationship Signals aggregation exited -9 without corroborating OOM evidence; classification: unknown_resource_termination.
        - Glacier Bancorp (9d2): Delivery to Promise failed with a badly exited driver and no explicit terminal signal; classification: unknown.
        - Andi Application Owner (621): MI3 (Market Insights 3) raw-output validation failed without an underlying pod cause in the captured task log; classification: application_error.
        - Event Bus subscriber validation failed in both observed runs because OpportunitySaved schema versions 8.6 and 8.9 have newer versions available; classification: application_error.
        - CA-02 had no task failures, but its DAG processor was unhealthy: 0 active DAGs versus 6 expected l3-main graphs, processor logs were unavailable, and 13 restarts were observed. OMS did not corroborate the failure.
        - Suggest a CA DAG-processor bounce for operator approval. No production mutation was performed.
