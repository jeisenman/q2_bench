schema_version: 1
capability: failure_discovery
description: Select every in-window failure while excluding prior-day distractors.
cases:
  - id: us-ca-operational-window
    dataset_uri: var/benchmark_data/prod_support/2026-09-24/steps/02-airflow-capture/2026-09-24/airflow_failures.json
    failed_since: "2026-09-24T05:00:00Z"
    exclude_records_before_since: true
    require_all_relevant_logs_inspected: true
    require_failure_identity_fields:
      - region
      - dag_id
      - run_id
      - task_id
      - try_number
