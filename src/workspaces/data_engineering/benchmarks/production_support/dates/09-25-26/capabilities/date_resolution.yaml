schema_version: 1
capability: date_resolution
description: Resolve user phrasing into deterministic Airflow query windows.
cases:
  - id: default-prod-support
    prompt: Do prod support
    reference_time: "2026-09-25T12:00:00Z"
    expected_operational_date: "2026-09-24"
    expected_since: "2026-09-24T05:00:00Z"
    expected_until: "2026-09-25T05:00:00Z"
    expected_ui_since: "2026-09-24T09:00:00Z"
    expected_ui_until: "2026-09-25T09:00:00Z"
    prohibit_one_sided_ui_window: true
  - id: yesterday
    prompt: Do yesterday's prod support
    reference_time: "2026-09-25T12:00:00Z"
    expected_operational_date: "2026-09-23"
    expected_since: "2026-09-23T05:00:00Z"
  - id: explicit-date
    prompt: Do prod support for 9/21/26.
    reference_time: "2026-09-25T12:00:00Z"
    expected_operational_date: "2026-09-21"
    expected_since: "2026-09-21T05:00:00Z"
  - id: explicit-run-start
    prompt: Do prod support for run/date_start 2026-03-14, 05:00:00 UTC
    reference_time: "2026-09-25T12:00:00Z"
    expected_operational_date: "2026-03-14"
    expected_since: "2026-03-14T05:00:00Z"
