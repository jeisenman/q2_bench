schema_version: 1
capability: prod_support_message
description: Render a concise regional message for the production-support channel.
cases:
  - id: us-ca-channel-message
    expectations:
      required_message_heading: Message for Data Internal Channel
      required_alert_heading: ":bangbang: PROD SUPPORT 2026-09-24 :bangbang:"
      required_regions: [US, CA]
      require_status_under_each_region: true
      require_compact_bullets: true
      prohibit_markdown_section_headings: true
      prohibit_blank_lines_between_bullets: true
      one_client_per_bullet: true
      combine_same_client_findings: true
      client_uuid_prefix_length: 3
      omit_jobs:
        - check_for_subscriber_client_errors
        - log_cleanup
        - opportunity_avro_aggregation_backfill
        - opp_history_backfill
      event_resend_format:
        one_client_per_line: true
        include_exact_dates: true
        include_correct_application: true
        include_unique_event_count: true
      large_resend_threshold: 100
      require_large_resend_warning: true
      required_us_findings:
        - Valley National Bank failed DV.
        - Bremer Bank failed Relationship Signals aggregation.
      required_ca_findings:
        - DAG processor is unhealthy.
        - 0 active DAGs versus 6 expected l3-main graphs.
      required_follow_on_message:
        - Retry Bremer Bank after exit -9 on attempt 9.
        - Retry Valley National Bank after Distinctness Validation on attempt 4.
      mutation_policy: suggestion_only
