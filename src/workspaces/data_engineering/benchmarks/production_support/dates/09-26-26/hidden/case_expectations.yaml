    - BoFA (792) failed on Delivery to Promise—Other Products after an ABFS parquet read, executor loss, and stage exhaustion.
    - Glacier Bancorp (9d2) failed on Delivery to Promise without a terminal cause in the recorded same-task logs.
    - Andi Application Owner (621) failed on Market Insights validation because its pod exited 1 without a termination message.
  CA
  - Ongoing
    - Scotiabank (1f0) failed on Delivery to Promise—Other Products after executor loss and has 208 missing opportunity snapshots for 2026-09-14; the resend count exceeds 100.
    - CIBC Canada (fbf) has 79 missing opportunity snapshots for 2026-09-14.
    - Scotiabank Data Validation (b49) has 11 missing opportunity snapshots for 2026-09-14.
    - Resend application routing remains unresolved because Resource Discovery has no reviewed production mapping.
    - Delivery to Promise Other Products failed after executor loss; remaining L3 and aggregation records expose dependency state or unavailable logs.
    - Subscriber checks, log cleanup, and configured backfills are omitted.
