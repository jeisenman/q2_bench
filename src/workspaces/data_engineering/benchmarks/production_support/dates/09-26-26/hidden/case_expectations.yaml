expected_developer_message: |
  Message for developer:
    - US Cluster Health: US pods and application checks are healthy as of 2026-09-26T17:04:26Z; KEDA status is unavailable because the configured read-only identity was denied.
    - CA Cluster Health: CA application health and DAG parsing are healthy as of 2026-09-26T17:04:26Z; one retired DAG processor replica remained unready with 13 restarts and KEDA status is unavailable.
    - DAGs parsing properly: 209 DAGs exist in US, 34 DAGs exist in CA.
    - These health bullets describe current 2026-09-26 state; the failures below are historical 2026-09-25 evidence.
    - Bremer Bank Relationship Signals time-series aggregation remains an ongoing carry-forward from the prior operational day. Attempt 9 exited -9 and OMS supplied no corroborating memory signal; classification: unknown_resource_termination.
    - BoFA failed Delivery to Promise Other Products with explicit Spark OOM evidence.
    - Scotiabank failed Delivery to Promise Other Products after executor loss and shuffle fetch failure.
    - US Delivery to Promise has no terminal cause in the recorded same-task logs.
    - US MI3 validation failed because its pod exited 1 without a termination message.
    - Subscriber checks failed on stale OpportunitySaved schema versions.
    - Scotiabank, CIBC Canada, and Scotiabank Data Validation failed validate_event_bus_opportunities for 2026-09-14 with 208, 79, and 11 missing snapshots respectively.
    - Resource Discovery supplied reviewed CA-02 resend-event links for all three clients.
    - CA log cleanup failed parsing the value "catchup".
    - CIBC Canada Validation failed opportunity-save-history, opportunities-report, and relationship-quadrants with dependency-state evidence only.
    - CIBC Canada failed engagement-events and high-quality-core-account-financial-statements with dependency-state evidence only.
    - Unresolved client 473 failed CMM, relationship-quadrants, and downstream opportunity and pipeline history jobs with dependency-state evidence only.
    - Ten CA opportunity-history logs are unavailable and have no recorded prior same-task terminal evidence.
