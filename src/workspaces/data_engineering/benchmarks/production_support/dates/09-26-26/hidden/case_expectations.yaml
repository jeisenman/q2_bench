expected_developer_message: |
  Message for developer:
    - US Cluster Health: US pods appear healthy as of 2026-09-26T17:04:26Z; KEDA status is unavailable because the configured read-only identity was denied; 3575 DAG processor restarts were recorded.
    - CA Cluster Health: CA Airflow application health and DAG parsing appear healthy as of 2026-09-26T17:04:26Z, but one retired DAG processor replica remained unready with 13 restarts after a 30-second retry; KEDA status is unavailable because the configured read-only identity was denied.
    - DAGs parsing properly: 209 DAGs exist in US, 34 DAGs exist in CA.
    - These health bullets describe current 2026-09-26 state; the failures below are historical 2026-09-25 evidence.
    - Bremer Bank Relationship Signals time-series aggregation remains an ongoing carry-forward from the prior operational day. Attempt 9 exited -9 and OMS supplied no corroborating memory signal; classification: unknown_resource_termination.
    - US Delivery to Promise Other Products failed after an ABFS parquet read error, executor loss, and Spark stage exhaustion.
    - CA Delivery to Promise Other Products failed after repeated executor loss; the initiating cause is unavailable.
    - US Delivery to Promise has no terminal cause in the recorded same-task logs.
    - US MI3 validation failed because its pod exited 1 without a termination message.
    - Subscriber checks failed on stale OpportunitySaved schema versions.
    - Scotiabank has 208 missing opportunity snapshots for 2026-09-14.
    - CIBC Canada has 79 missing opportunity snapshots for 2026-09-14.
    - Scotiabank Data Validation has 11 missing opportunity snapshots for 2026-09-14.
    - Resource discovery completed, but no reviewed production resend application mapping exists.
    - CA log cleanup failed parsing the value "catchup".
    - Remaining CA L3 and aggregation failures expose dependency state only.
    - Ten CA opportunity-history logs are unavailable and have no recorded prior same-task terminal evidence.
