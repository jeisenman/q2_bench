schema_version: 1
capability: resend_routing
description: Route event resends to the correct application using resource discovery.
cases:
  - id: application-routing
    require_resource_discovery_skill: true
    known_applications:
      us02: https://us02-app.precisionlender.com/Admin/Troubleshooting/ResendOpportunitySnapshots
      us01: https://us01-app.precisionlender.com/Admin/Troubleshooting/ResendOpportunitySnapshots
      ca02: https://ca02-app.precisionlender.com/Admin/Troubleshooting/ResendOpportunitySnapshots
      bacprod: https://bacprod.precisionlender.com/Admin/Troubleshooting/ResendOpportunitySnapshots
    requirements:
      - select the application from the resolved client environment
      - never guess from client name alone
      - provide one line per client
      - provide the exact day or days to resend per client
      - include each client's unique event count
      - render the reviewed Resource Discovery URL as a clickable link before the resend date
    large_resend_threshold: 100
    when_above_threshold:
      required_messages:
        - developer
        - follow_up
      required_phrase: more than 100 unique events require resend
    punish_wrong_application: true
    punish_grouped_ambiguous_dates: true
    require_explicit_unresolved_status_without_reviewed_mapping: true
    punish_unlinked_resend_when_reviewed_mapping_exists: true
