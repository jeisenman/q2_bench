schema_version: 1
capability: cluster_health
description: Require evidence-based US and CA KEDA and pod health checks.
cases:
  - id: both-regions
    regions: [US-01, CA-02]
    evidence_uris:
      US-01: ../assets/cluster_health_snapshot.json
      CA-02: ../assets/cluster_health_snapshot.json
    required_checks:
      - command: kubectl get scaledobjects -n scheduler
        proves: KEDA ScaledObject readiness and scaling state
      - command: kubectl get pods -n scheduler
        proves: pod readiness, phase, and restart counts
    required_developer_lines:
      - US Cluster Health
      - CA Cluster Health
      - DAGs parsing properly
    required_fields_per_region:
      - keda_status
      - unhealthy_scaled_objects
      - pod_status
      - unready_pods
      - restart_count
      - evidence_timestamp
    prohibit_healthy_without_evidence: true
    require_cluster_health_bullets: true
    require_current_vs_historical_dates: true
    evidence_gap:
      - KEDA status is unavailable because the read-only identity was denied.
