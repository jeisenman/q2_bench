schema_version: 1
capability: cluster_health
description: Run the selected-region cluster script and return pod, restart, and KEDA health.
cases:
  - id: both-regions
    regions: [US-01, CA-02]
    evidence_uris:
      US-01: ../assets/cluster_health_snapshot.json
      CA-02: ../assets/cluster_health_snapshot.json
    required_checks:
      - command: scripts/check_prod_cluster_health.py --region <region>
        proves: pod readiness, restart counts, and KEDA ScaledObject health
    required_developer_lines:
      - US Cluster Health
      - CA Cluster Health
    required_fields_per_region:
      - keda_status
      - pods_healthy
      - restart_count
      - observed_at
      - symptoms
      - warnings
    require_health_timestamp_in_developer_message: true
    retired_replica_policy: warning_only_when_primary_pods_are_healthy
    prohibit_healthy_without_evidence: true
    prohibit_unhealthy_when_primary_health_checks_pass: true
    prohibit_conflicting_health_labels: true
    require_warning_to_be_separate_from_overall_status: true
    require_cluster_health_bullets: true
    require_current_vs_historical_dates: true
    status_policy:
      - derive each regional status from pod and KEDA evidence
      - keep access gaps as warnings unless a primary check fails
      - reject any summary that conflicts with the cited evidence
