schema_version: 1
matrix_id: prod-support-09-26-26
suite: 09-26-26
benchmark: production-support
experiment_name: production_operations
execution:
  runtime: container
  container_image: agentsdk-agentbench:local
  parallelism: 6
  sandbox: read-only
  artifact_root: var/benchmark_matrix/prod-support-09-26-26
judge_configuration: sol-xhigh-judge
rubric:
  - id: prior_run_log_fallback
    weight: 2.5
    reward: Pages backward across the same DAG and task when the latest log is unavailable, then cites the first prior terminal evidence.
    punish: Stops at an empty or unavailable latest log, changes task identity, or searches unrelated runs.
  - id: bounded_airflow_links
    weight: 2.0
    reward: Links use both lower and upper end-date filters for the requested day.
    punish: A one-sided filter includes failures from prior or subsequent days.
  - id: spark_evidence_race
    weight: 2.5
    reward: Starts exact Airflow-log and OMS queries concurrently for Spark jobs.
    punish: Uses only one source or serializes independent evidence queries.
  - id: timeout_short_circuit
    weight: 2.0
    reward: Classifies explicit AirflowTaskTimeout evidence and cancels pending OMS work.
    punish: Reports an unknown driver exit or waits for unnecessary OMS work.
  - id: cluster_health
    weight: 2.0
    reward: Checks KEDA ScaledObjects and pods in US and CA and reports both health lines.
    punish: Omits either region, KEDA, pods, or evidence-qualified health status.
  - id: resource_discovery_routing
    weight: 2.0
    reward: Uses resource discovery to select the client's correct resend application.
    punish: Guesses a domain or supplies a link for the wrong client environment.
  - id: resend_specificity
    weight: 2.0
    reward: Gives each client, resend date, event count, and correct application line by line.
    punish: Groups ambiguous resend instructions or omits a requested date.
  - id: large_resend_escalation
    weight: 1.5
    reward: Calls out more than 100 unique events in developer and Data Internal messages.
    punish: Hides a large resend count in either audience's message.
  - id: omitted_job_filter
    weight: 1.5
    reward: Discovers all failures but omits configured maintenance and subscriber jobs from Data Internal.
    punish: Drops them from investigation or includes them in the channel message.
  - id: developer_readability
    weight: 1.5
    reward: Groups clients naturally by job while preserving root causes and evidence.
    punish: Emits raw identifiers, classifications without explanation, or incomplete errors.
  - id: root_cause_coverage
    weight: 2.5
    reward: Gives an evidence-backed root cause or explicitly states what evidence is missing.
    punish: Lists a failure without diagnosis or presents speculation as fact.
group_by: [matrix_id, suite, case_id]
compare_by: [profile, model, reasoning_effort]
