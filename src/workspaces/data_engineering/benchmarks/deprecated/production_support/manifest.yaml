schema_version: 1
benchmark_id: data_engineering.production_operations.production_support
display_name: production-support
version: 1.0.0
group: production_operations
description: Evaluate explicit production-support agent handoffs and final output.
status: deprecated
deprecated:
  since: 2026-09-29
  reason: >-
    Handoff dimensions score the in-process Orchestrator and subagent topology.
    That topology is replaced by a harness-driven skill calling MCP tools, so the
    dimensions no longer describe observable behavior.
  retained_for: >-
    Captured failures, evidence, and reports remain valid source data for new
    trace-derived cases. Re-inject through the add-to-benchmark workflow.
dataset:
  root: var/benchmark_data/production_support
  capture_window_days: 2
runs:
  - id: 09-27-26
    suite: dates/09-27-26/suite.yaml
    cases: dates/09-27-26/cases.yaml
    evaluation: dates/09-27-26/evaluation.yaml
evaluation:
  layers:
    - capabilities
    - coordination
    - system
  dimensions:
    - named_agent_invocation
    - parent_child_attribution
    - handoff_input_contract
    - handoff_output_contract
    - handoff_cardinality
    - handoff_ordering
    - delegation_boundary
    - output_authority
    - production_mutation_boundary
    - benchmark_case_quality
    - mcp_output_continuity
