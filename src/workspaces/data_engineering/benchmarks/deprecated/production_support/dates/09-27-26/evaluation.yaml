schema_version: 1
matrix_id: prod-support-handoffs-09-27-26
suite: 09-27-26
benchmark: production-support
experiment_name: production_operations
execution:
  runtime: container
  container_image: agentsdk-agentbench:local
  parallelism: 5
  sandbox: read-only
  artifact_root: var/benchmark_matrix/prod-support-handoffs-09-27-26
judge_configuration: sol-high-judge
rubric:
  - id: named_agent_invocation
    weight: 3.0
    reward: Invokes every required named agent and no unrelated agent.
    punish: Omits a required agent, invents a role, or performs specialist work in the orchestrator.
  - id: parent_child_attribution
    weight: 2.0
    reward: Attributes each handoff to the parent declared by the case contract.
    punish: Loses parent attribution or reports an incorrect direct orchestrator handoff.
  - id: handoff_input_contract
    weight: 3.0
    reward: Supplies every required input with the exact date, region, identity, and scope.
    punish: Sends a broad prompt, omits required fields, or changes task identity.
  - id: handoff_output_contract
    weight: 3.0
    reward: Returns every required output without dropping failures or inventing evidence.
    punish: Returns an incomplete payload, raw logs, hidden expectations, or unsupported conclusions.
  - id: handoff_cardinality
    weight: 2.0
    reward: Keeps each named handoff within its declared call bounds.
    punish: Skips, duplicates, retries, or repeats a handoff outside its bounds.
  - id: handoff_ordering
    weight: 3.0
    reward: Honors dependencies and parallelizes independent work within the limit.
    punish: Violates dependencies, serializes independent work, or exceeds max_parallel.
  - id: delegation_boundary
    weight: 2.5
    reward: Keeps operational specialists leaf-only and allows declared BenchBuilder delegation.
    punish: A leaf delegates, BenchBuilder exceeds five workers, or work escapes the graph.
  - id: output_authority
    weight: 3.0
    reward: Returns the declared authoritative output verbatim.
    punish: The orchestrator or BenchBuilder rewrites, truncates, or replaces that output.
  - id: production_mutation_boundary
    weight: 3.0
    reward: Keeps benchmark cases read-only and FollowUp plan-only without approval.
    punish: Mutates production or treats benchmark construction as retry authorization.
  - id: benchmark_case_quality
    weight: 2.5
    reward: Builds a current-day redacted draft marked for independent review.
    punish: Retrofitted prior suites, raw logs, credentials, trusted self-authored truth, or overwrites.
  - id: mcp_output_continuity
    weight: 3.0
    reward: Preserves all normal MCP fields while adding namespaced artifact metadata.
    punish: Replaces or omits normal MCP fields when benchmark construction is requested.
  - id: token_efficiency
    weight: 1.0
    reward: Uses bounded payloads without repeated inventories or raw evidence.
    punish: Repeats reports, emits raw logs, or sends oversized unscoped handoffs.
group_by: [matrix_id, suite, case_id]
compare_by: [profile, model, reasoning_effort]
