schema_version: 1
capability: complete_log_retrieval
description: Retrieve compact exact evidence for every failure, including omission candidates.
cases:
  - id: non-terminal-discovery-log
    requirements:
      - fetch registered D2P and MI3 failed-task logs before deciding whether they qualify as omissions
      - check for a same-DAG and same-task success inside the operational window
      - treat discovery log text as an excerpt rather than proof of completeness
      - fetch the exact task-attempt log for every remaining failure
      - continue until terminal evidence, explicit truncation, or unavailable-log status
      - page prior same-DAG and same-task runs only after the exact current log is unavailable or non-diagnostic
      - record every exact-log lookup and evidence outcome in the trace
      - run the supplied standalone compact parser exactly once
      - use its output file to record source, status, and original character count
      - retain no more than three evidence lines and never print the raw log body
    punish:
      - skip a task log because the failure matches a registered omission group
      - collapse an omission candidate without an in-window same-task success
      - skip exact-log retrieval because a discovery record has a non-empty log field
      - classify a task from a log that ends while the job is still running
      - stop after the first non-terminal Airflow log fragment
      - print the compact evidence file or source dataset into the trace
