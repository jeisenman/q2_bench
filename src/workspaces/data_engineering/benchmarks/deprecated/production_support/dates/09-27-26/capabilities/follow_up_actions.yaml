schema_version: 1
capability: follow_up_actions
description: Offer explicit remediation choices and execute retries on follow-up.
cases:
  - id: actionable-remediation
    required_heading: "Follow Ups:"
    required_structure:
      - "- Would you like to:"
      - "  - Follow up with pd-rix about <number> opportunities for <client names> on [Resend Opportunity Snapshots](<approved link>) for date <MM-DD-YY>."
      - "  - Resend <number> opportunities for <client names> on [Resend Opportunity Snapshots](<approved link>) for date <MM-DD-YY>."
      - "  - Ask a human to resolve the client identity for <unresolved client labels> before proposing remediation for date <MM-DD-YY>."
      - "  - Do you approve re-running the following jobs:"
      - "    - <client or grouped clients>: <job> for <YYYY-MM-DD>; also move to [KPO sizing agent](agent://kpo-sizer/definition)"
    default_omission_groups: [d2p, mi3, subscriber, maintenance, backfill, cmm]
    large_resend_threshold: 100
    large_resend_owner: pd-rix
    kpo_sizing_agent_uri: agent://kpo-sizer/definition
    requirements:
      - expose the MCP prompt as "Reply with follow up to execute these re-runs:"
      - list only evidence-supported non-omitted retry candidates after that prompt
      - resolve and include a reviewed application link through Resource Discovery with every offered event resend
      - when routing is unresolved, ask to resolve the production link first and do not offer an unlinked resend
      - when client identity is unresolved, ask a human to resolve it and do not offer remediation for that client
      - copy canonical action templates exactly without paraphrasing
      - group identical rerun jobs across clients
      - omit configured Data Internal jobs from rerun suggestions
      - suggest pd-rix follow-up when an event resend exceeds 100
      - suggest KPO sizing in addition to rerun approval when any grouped job exceeds five attempts
      - expose KPO sizing as an agent URI only and do not invoke it
      - treat a developer follow-up as authorization to execute exact reruns
      - return the original US and CA validation links after reruns
      - include the operational date on every resend and rerun choice
      - return no action is required when no evidence-supported action exists
      - exclude diagnoses, evidence gaps, status summaries, and other non-actions
      - never claim a mutation occurred
    prohibited_follow_ups:
      - schema upgrades
      - missing-log retrieval
      - diagnostic evidence collection
      - broad review or investigation requests
      - cluster warnings without a supported remediation
