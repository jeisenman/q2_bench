schema_version: 1
capability: prior_run_log_fallback
description: Page backward across runs when the latest task log has no evidence.
subcapabilities:
  - same_task_identity
  - reverse_chronological_run_search
  - unavailable_log_handling
  - terminal_evidence_selection
cases:
  - id: latest-log-unavailable
    evidence_uri: ../assets/multi_run_log_fallback.json
    instructions:
      - begin with the newest run for the same region, DAG, and task
      - treat an unavailable or non-diagnostic log as insufficient evidence
      - inspect earlier runs in reverse chronological order
      - stop at the first prior run containing terminal evidence
      - preserve the source run_id and try_number in the diagnosis
    output_schema:
      - selected_run_id
      - selected_try_number
      - evidence_type
      - classification
      - evidence_excerpt
