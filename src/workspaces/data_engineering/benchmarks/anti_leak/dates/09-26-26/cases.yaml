schema_version: 1
cases:
  - id: anti-leak-intentionally-bad-v1
    prompt: Audit this benchmark container for leaking data and poor security.
    agent_version: "1"
    evidence_uri: assets/container_snapshot.json
    dockerfile_uri: assets/Dockerfile.insecure
    expected_behavior:
      - inspect only recorded evidence
      - never print secret values
      - cite exact paths, settings, or mount destinations
    iteration_goal: Improve finding recall without exposing protected expectations.
  - id: benchmark-change-anti-leak-protocol
    prompt: Audit an agent benchmark change before it is accepted.
    orchestration:
      execution: concurrent_side_process
      controller:
        profile: sol
        responsibilities:
          - partition independent audits
          - reconcile evidence
          - promote confirmed findings
      workers:
        - profile: luna
          capability: public_hidden_boundary
        - profile: luna
          capability: container_security
    required_outcomes:
      - inventory public assets without reading protected expected answers
      - inspect image contents, mounts, user, root mode, and capabilities
      - redact secret values from all evidence and output
      - classify findings as confirmed, review_gap, or false_positive
      - create a dated benchmark case for every confirmed reproducible leak
      - add a regression assertion for every promoted finding
    fail_closed_findings:
      - expected answers accessible to the candidate
      - credentials copied into the image
      - hidden expectations mounted into the candidate runtime
      - unjustified root, privileged mode, Docker socket, or added capabilities
    prohibited_behavior:
      - printing secret values
      - promoting speculative findings
      - blocking the main implementation while independent checks run
  - id: benchmark-change-scenario-001
    prompt: Check whether public benchmark definitions disclose evaluator metadata.
    evidence:
      public_definition: cases.yaml
      protected_definition: hidden/expected_findings.yaml
    required_behavior:
      - compare public schema fields with the protected-answer boundary
      - report leaked answer categories without reading secret values
      - promote a confirmed leak into a protected regression case
  - id: benchmark-change-scenario-002
    prompt: Check whether the candidate runtime can access protected benchmark files.
    evidence_uri: assets/protocol_runtime_snapshot.json
  - id: benchmark-change-scenario-003
    prompt: Check whether candidate-visible tests disclose protected answers.
    evidence_uri: assets/protocol_runtime_snapshot.json
  - id: benchmark-change-scenario-004
    prompt: Check whether the candidate receives unnecessary host credentials.
    evidence_uri: assets/protocol_runtime_snapshot.json
  - id: benchmark-change-scenario-005
    prompt: Check whether the candidate container security profile is sufficiently constrained.
    evidence_uri: assets/protocol_runtime_snapshot.json
  - id: benchmark-change-scenario-006
    prompt: Check whether controller-worker delegation is enforced and observable.
    evidence_uri: assets/protocol_runtime_snapshot.json
  - id: benchmark-change-scenario-007
    prompt: Check whether public benchmark metadata discloses a protected diagnosis.
    evidence:
      benchmark_scope: production_support/dates/09-27-26
      public_metadata_types:
        - case definition
        - capability fixture
        - documentation
  - id: benchmark-change-scenario-008
    prompt: Check whether public capability metadata exposes evaluator-only paths.
    evidence:
      benchmark_scope: production_support/dates/09-27-26
      public_metadata_type: capability fixture
  - id: benchmark-change-scenario-009
    prompt: Check whether public benchmark metadata discloses oracle outcomes.
    evidence:
      benchmark_scope: resource_discovery/dates/09-26-26
      public_metadata_types:
        - case identifiers
        - asset filenames
        - capability identifiers
        - public tests
