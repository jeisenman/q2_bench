schema_version: 1
id: prod-support
workspace: data_engineering
display_name: Prod Support
summary: Discover, triage, and remediate production Airflow failures across US and CA.
harnesses:
  - claude
  - codex
mcp:
  server: prod-support
  tools:
    - inspect_cluster_health
    - get_prod_support_omissions
    - list_failed_task_instances
    - get_dag_status
    - get_task_instance_state
    - get_task_log
    - has_task_success
    - get_task_metadata
    - execute_prod_support_follow_up
    - plan_prod_support_dependency_rerun
    - execute_prod_support_dependency_rerun
    - setup_prod_support
    - set_prod_support_omissions
    - update_prod_support_omissions
    - list_prod_support_updates
    - get_kpo_job_templates
    - estimate_kpo_resources
    - run_prod_support
requires_env:
  - PROD_SUPPORT_SOURCE
  - USAIRFLOWHOST
  - USAIRFLORUSER
  - USAIRFLOWPASSWORD
  - CAAIRFLOWHOST
  - CAAIRFLORUSER
  - CAAIRFLOWPASSWORD
