name: lineage

on:
  workflow_dispatch:
  repository_dispatch:
    types: [di-pipelines-master-push, radar-lineage-source-push]
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/lineage.yml"
      - "migrations/postgres/002_lineage.sql"
      - "src/adapters/postgres/lineage.py"
      - "src/cli/lineage.py"
      - "src/workspaces/data_engineering/workflows/lineage/**"

permissions:
  contents: read

concurrency:
  group: radar-lineage-static-analysis
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    env:
      LINEAGE_POSTGRES_DSN: ${{ secrets.LINEAGE_POSTGRES_DSN }}
    steps:
      - name: Check out lineage repository
        uses: actions/checkout@v4

      - name: Check out DI Pipelines master
        uses: actions/checkout@v4
        with:
          repository: precisionlender/di-pipelines
          ref: master
          path: external/di-pipelines
          token: ${{ secrets.DI_PIPELINES_READ_TOKEN }}

      - name: Check out RADAR notebooks master
        uses: actions/checkout@v4
        with:
          repository: precisionlender/radar-notebooks
          ref: master
          path: external/radar-notebooks
          token: ${{ secrets.DI_PIPELINES_READ_TOKEN }}

      - name: Check out RADAR libraries master
        uses: actions/checkout@v4
        with:
          repository: precisionlender/radar-libraries
          ref: master
          path: external/radar-libraries
          token: ${{ secrets.DI_PIPELINES_READ_TOKEN }}

      - name: Check out RADAR ADF master
        uses: actions/checkout@v4
        with:
          repository: precisionlender/radar-adf-pipeline
          ref: master
          path: external/radar-adf-pipeline
          token: ${{ secrets.DI_PIPELINES_READ_TOKEN }}

      - name: Check out DataIngress master
        uses: actions/checkout@v4
        with:
          repository: precisionlender/pl-dataingress
          ref: master
          path: external/pl-dataingress
          token: ${{ secrets.DI_PIPELINES_READ_TOKEN }}

      - name: Check out calculation engine develop
        uses: actions/checkout@v4
        with:
          repository: precisionlender/pl-calculation-engine
          ref: develop
          path: external/pl-calculation-engine
          token: ${{ secrets.DI_PIPELINES_READ_TOKEN }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Apply lineage schema
        run: psql "$LINEAGE_POSTGRES_DSN" -v ON_ERROR_STOP=1 -f migrations/postgres/002_lineage.sql

      - name: Extract and persist graph
        run: >-
          uv run agentbench lineage-sync
          --repository external/di-pipelines
          --radar-notebooks-repository external/radar-notebooks
          --radar-libraries-repository external/radar-libraries
          --radar-adf-repository external/radar-adf-pipeline
          --data-ingress-repository external/pl-dataingress
          --engine-repository external/pl-calculation-engine
          --source-ref static-analysis
          --output var/lineage/radar-lineage.json

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-lineage
          path: var/lineage/radar-lineage.json
