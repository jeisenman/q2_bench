[project]
name = "q2-bench"
version = "0.1.0"
description = "Go SDK and MCP API with a Python-only Databricks runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.142",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-xdist>=3.8",
    "ruff>=0.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/adapters/databricks",
    "src/adapters/local",
    "src/adapters/outbound",
    "src/databricks_runtime",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "FA",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "UP",
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebook source intentionally relies on runtime-provided globals
# and remains Python. The same source is mirrored into both harnesses.
"src/workspaces/*/skills/**/assets/kpo_adls_size_inventory.py" = [
    "ANN001",
    "ANN201",
    "D100",
    "D103",
    "E501",
    "F821",
    "N812",
    "TRY003",
]
".claude/skills/**/assets/kpo_adls_size_inventory.py" = [
    "ANN001",
    "ANN201",
    "D100",
    "D103",
    "E501",
    "F821",
    "N812",
    "TRY003",
]
".codex/skills/**/assets/kpo_adls_size_inventory.py" = [
    "ANN001",
    "ANN201",
    "D100",
    "D103",
    "E501",
    "F821",
    "N812",
    "TRY003",
]
# Skill scripts are standalone CLI helpers the harness executes directly,
# not library code this package imports. They keep the correctness and
# security rules and are excluded only from library-shaped style rules:
# full annotations, docstrings, import placement, and argument counts.
"src/workspaces/*/skills/**/scripts/*.py" = [
    "ANN001",
    "ANN401",
    "D101",
    "D103",
    "E501",
    "PLC0415",
    "PLR0911",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PLW2901",
    "RUF059",
    "SIM102",
    "T201",
    "TRY003",
    "TRY004",
    "TRY301",
]
".claude/skills/**/scripts/*.py" = [
    "ANN001",
    "ANN401",
    "D101",
    "D103",
    "E501",
    "PLC0415",
    "PLR0911",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PLW2901",
    "RUF059",
    "SIM102",
    "T201",
    "TRY003",
    "TRY004",
    "TRY301",
]
".codex/skills/**/scripts/*.py" = [
    "ANN001",
    "ANN401",
    "D101",
    "D103",
    "E501",
    "PLC0415",
    "PLR0911",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PLW2901",
    "RUF059",
    "SIM102",
    "T201",
    "TRY003",
    "TRY004",
    "TRY301",
]
"tests/**" = ["ANN", "D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/adapters/databricks", "src/adapters/local", "src/adapters/outbound", "src/databricks_runtime"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests/unit/adapters/databricks"]
markers = [
    "production: read-only checks against explicitly enabled production resources",
]
