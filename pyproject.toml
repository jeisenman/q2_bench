[project]
name = "q2-bench"
version = "0.1.0"
description = "Local-first data-engineering agent benchmark workspace."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "inspect-ai>=0.3",
    "mcp>=1.0",
    "mlflow==3.16.1",
    "pyyaml>=6.0",
]

[project.scripts]
agentbench = "cli.main:main"
prod-support-mcp = "mcp_servers.prod_support:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8",
    "ruff>=0.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/adapters",
    "src/cli",
    "src/domain",
    "src/mcp_servers",
    "src/ports",
    "src/workspaces",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "FA",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "UP",
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
".codex/skills/**/scripts/*.py" = ["ANN401", "D103", "T201", "TRY003"]
"tests/**" = ["ANN", "D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "production: read-only checks against explicitly enabled production resources",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
