[project]
name = "semantic-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Flask==3.1.3", "mlflow==3.18.0"]

[project.scripts]
semantic-api = "semantic_api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.ruff.lint.isort]
known-first-party = ["semantic_api"]
