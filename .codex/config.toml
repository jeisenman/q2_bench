[mcp_servers.prod_support]
url = "http://127.0.0.1:8765/mcp"
startup_timeout_sec = 20
tool_timeout_sec = 300
default_tools_approval_mode = "prompt"

[mcp_servers.prod_support.tools.run_prod_support]
approval_mode = "approve"

[mcp_servers.prod_support.tools.get_prod_support_omissions]
approval_mode = "approve"

[mcp_servers.prod_support.tools.list_prod_support_updates]
approval_mode = "approve"

[mcp_servers.prod_support.tools.execute_prod_support_follow_up]
approval_mode = "prompt"

[mcp_servers.prod_support.tools.setup_prod_support]
approval_mode = "prompt"

[mcp_servers.prod_support.tools.set_prod_support_omissions]
approval_mode = "prompt"

[mcp_servers.prod_support.tools.update_prod_support_omissions]
approval_mode = "prompt"
