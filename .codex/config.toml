# Project-scoped Codex MCP configuration for the data-engineering harness.
# Codex loads this file only when the project is trusted.

[mcp_servers.airflow]
command = "go"
args = ["-C", "/Users/jeisenman/ra/qtwo_bench", "run", "./cmd/q2-mcp", "--server", "airflow"]
env = { Q2_MCP_DEBUG = "1" }
startup_timeout_sec = 20
tool_timeout_sec = 120
default_tools_approval_mode = "approve"

[mcp_servers.remote_data]
command = "go"
args = ["-C", "/Users/jeisenman/ra/qtwo_bench", "run", "./cmd/q2-mcp", "--server", "remote-data"]
env = { Q2_MCP_DEBUG = "1" }
startup_timeout_sec = 20
tool_timeout_sec = 120
default_tools_approval_mode = "approve"

[mcp_servers.resource_discovery]
command = "go"
